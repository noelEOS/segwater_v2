defaults:
  - data: memmap
  - model: smp
  - trainer: default
  - _self_

# Optuna Configuration
n_trials: 60
# HyperbandPruner min_resource in global steps. 800 = the shipped HPO
# protocol. Do NOT lower to 400: warmup_steps=500, so a rung at 400 ranks
# trials mid-warmup (80% of base LR, cosine decay not started) and biases
# pruning against high-LR configs — and base LR is itself a swept parameter.
# With val checks at 400/800/1200, 800 is the earliest post-warmup rung.
pruner_min_resource: 800

# HPO checkpoints are isolated by trial under root_dir. With the defaults, each
# retained file contains only {"model_state_dict": ...}: enough for
# inference/serving, without optimizer state because HPO trials are not resumed.
# keep_top_k ranks by the active objective (pair-macro water IoU when
# strata_index_path is set); save_last additionally preserves the completed
# trial's final-step weights, which correspond to optimize.py's final-check
# objective even when the within-trial best occurred earlier.
hpo_checkpoints:
  enabled: true
  root_dir: ${output_dir}/hpo_checkpoints
  keep_top_k: 1
  save_last: true
  model_weights_only: true

# Database Storage (Resolves from .env, defaults to empty string)
optuna_storage: ${oc.env:NEON_DB_URL, ''}

project_name: coastal_water_seg
seed: 42
device: cuda
output_dir: outputs/stage2/${model.arch}_${model.encoder_name}/${now:%H-%M-%S}_s${seed}

study_name: hpo_pm_${model.arch}_${model.encoder_name}
