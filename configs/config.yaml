defaults:
  - data: memmap
  - model: smp
  - trainer: default
  - _self_

# Mixed-forward ConvNeXtV2-Tiny HPO protocol. At batch 256 the 612,364-chip
# train split has ceil(612364/256) = 2,393 optimizer steps per epoch.
n_trials: 16

search_space:
  base_learning_rate:
    low: 3.0e-5
    high: 1.0e-3
    log: true
  weight_decay:
    low: 1.0e-7
    high: 1.0e-1
    log: true
  label_smoothing:
    low: 0.0
    high: 0.12
    log: false
  # Historical name: this is the Lovasz-loss mixture weight, not Dice.
  dice_weight:
    low: 0.0
    high: 0.5
    log: false

hpo:
  max_steps: 23930                 # 10 epochs
  scheduler_total_steps: 23930     # fixed for every trial, including pruned ones
  warmup_steps: 500
  val_check_interval: 4786         # report every 2 epochs
  # HPO constructs workers after CUDA initialization; spawn prevents workers
  # from inheriting the parent's CUDA context through Linux fork.
  dataloader_multiprocessing_context: spawn

# Rungs: 4,786 / 9,572 / 19,144 steps = 2 / 4 / 8 epochs. With 16 trials and
# reduction_factor=2 this targets ~16 -> 8 -> 4 -> 2 trials; survivors finish
# the common 23,930-step (10-epoch) horizon.
pruner:
  type: successive_halving
  min_resource: 4786
  reduction_factor: 2
  min_early_stopping_rate: 0
  bootstrap_count: 0

# HPO checkpoints are isolated by trial under root_dir. With the defaults, each
# retained file contains only {"model_state_dict": ...}: enough for
# inference/serving, without optimizer state because HPO trials are not resumed.
# keep_top_k ranks by the active objective (pair-macro water IoU when
# strata_index_path is set); save_last additionally preserves the completed
# trial's final-step weights, which correspond to optimize.py's final-check
# objective even when the within-trial best occurred earlier.
hpo_checkpoints:
  enabled: true
  root_dir: ${output_dir}/hpo_checkpoints
  keep_top_k: 1
  save_last: true
  model_weights_only: true

# Database Storage (Resolves from .env, defaults to empty string)
optuna_storage: ${oc.env:NEON_DB_URL, ''}

project_name: coastal_water_seg
seed: 42
device: cuda
output_dir: outputs/stage2/${model.arch}_${model.encoder_name}/${now:%H-%M-%S}_s${seed}

# Keep this protocol isolated from legacy studies whose bounds and pruner differ.
study_name: hpo_mixed80_blocked_sha_${model.arch}_${model.encoder_name}
