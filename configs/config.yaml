defaults:
  - data: memmap
  - model: smp
  - trainer: default
  - _self_

# Optuna Configuration
n_trials: 60
# HyperbandPruner min_resource in global steps. 400 aligns rungs with
# val_check_interval=400 (pruning possible at 400/800/1200); the previous
# hardcoded 800 allowed pruning only at step 1200 under max_steps=1500.
pruner_min_resource: 400

# Database Storage (Resolves from .env, defaults to empty string)
optuna_storage: ${oc.env:NEON_DB_URL, ''}

project_name: coastal_water_seg
seed: 42
device: cuda
output_dir: outputs/stage2/${model.arch}_${model.encoder_name}/${now:%H-%M-%S}_s${seed}

study_name: hpo_${model.arch}_${model.encoder_name}