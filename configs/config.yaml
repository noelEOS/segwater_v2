defaults:
  - data: memmap
  - model: smp
  - trainer: default
  - _self_

# Optuna Configuration
n_trials: 60
# HyperbandPruner min_resource in global steps. 800 = the shipped HPO
# protocol. Do NOT lower to 400: warmup_steps=500, so a rung at 400 ranks
# trials mid-warmup (80% of base LR, cosine decay not started) and biases
# pruning against high-LR configs — and base LR is itself a swept parameter.
# With val checks at 400/800/1200, 800 is the earliest post-warmup rung.
pruner_min_resource: 800

# HPO dataloader workers. Trials build their loaders after CUDA is
# initialised; Linux fork would copy that context into every worker, which
# can later abort with c10::AcceleratorError. spawn starts clean interpreters.
hpo:
  dataloader_multiprocessing_context: spawn

# Database Storage (Resolves from .env, defaults to empty string)
optuna_storage: ${oc.env:NEON_DB_URL, ''}

project_name: coastal_water_seg
# Lineage token carried into the Optuna study name, the stage-2 output dir
# and the wandb groups. Optuna is opened with load_if_exists=True, so a
# study name without this token would RESUME the previous lineage's study
# (the mixed80 hpo_pm_* studies live in the same Neon database).
lineage: v3
seed: 42
device: cuda
output_dir: outputs/stage2_${lineage}/${model.arch}_${model.encoder_name}/${now:%H-%M-%S}_s${seed}

study_name: hpo_pm_${lineage}_${model.arch}_${model.encoder_name}