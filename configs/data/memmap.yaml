memmap_root: /home/jovyan/shared/noelivanulloa/globalpairs/OTHER_PROJECTS/Global_Sen12Coast/PRODUCTION_DATASET
H: 224
W: 224
# On-disk storage dtype of the memmaps under memmap_root. float32 for the
# chip-based and pair-based datasets; float16 for the mixed80_blocked lineage
# (experiments/DATASET_mixed80_blocked_612k), which halves the bytes. Samples are
# always returned to the model as float32, so this does not change model inputs.
# A wrong value fails loudly at dataset construction (file size not divisible by
# bytes-per-sample) rather than silently misreading.
dtype: float32
batch_size: 256
val_batch_size: 256
num_workers: 8
pin_memory: true
persistent_workers: true
# Enables pair-macro water IoU on mixed chips (the checkpoint-ladder re-ranking
# metric) during validation. HPO (optimize.py) uses the subset npz
# data/hpo_strata/hpo_val_pair_strata.npz (baked eligible mask, >=5-mixed gate)
# and makes it the objective; stage2 (train.py) uses the full-val ladder npz
# data/full_val_strata/strata_index.npz (git-tracked, so the VM gets it via
# git pull -- no scp needed; no eligible key -> derived as
# pair_mixed_count >= 20) as added val/strat/* metrics only (selection stays
# pooled-mIoU). null keeps the pooled val-mIoU objective and leaves the val path
# byte-identical.
strata_index_path: null
augment: false
# Per-aug probabilities forwarded to CoastalAug when augment: true.
# These defaults match CoastalAug's signature, so flipping augment to true
# without changing them reproduces the previous hardcoded augmentation.
# Enable rotation, e.g., with: data.augment=true data.aug.rot90_k_prob=0.5
aug:
  hflip_p: 0.5
  vflip_p: 0.5
  rot90_k_prob: 0.0
