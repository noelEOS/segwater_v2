# configs/inference_sweep-dinov3.yaml
#
# Lightweight development sweep for running one or more scenes through a
# DINOv3 checkpoint. The sweep runner expands this file into repeated calls
# to scripts/run_inference.py. Mirrors configs/inference_sweep-swinv2.yaml.
#
# NOTE: no dinov3 checkpoint exists on this machine yet — checkpoint_path
# below is a placeholder to update once training produces one (e.g. on the VM).

sweep:
  name: "dev_sweep_all_narrabeen_dinov3"
  dry_run: false
  continue_on_error: true

  input_dir: "/home/noel/NARRABEEN_ron_147_ts_9_sn_16/input_data_ron_147_ts_9_sn_16_small_aoi"
  input_glob: "*.tif"

  # Overrides applied to every run in the sweep.
  common_overrides:
    inference.post_processing.smoothing.apply_simplification: true
    inference.post_processing.smoothing.simplify_tolerance_meters: 1.0
    inference.post_processing.filtering.apply_length_filter: false
    inference.post_processing.filtering.min_length_meters: 10000.0
    inference.data.edge_policy: "shift_inward"
    inference.stitching.min_weight: 0.001

  checkpoints:
      - name: "dinov3_vitb16"
        checkpoint_path: "outputs/stage2/dinov3-linear_facebook_dinov3-vitb16-pretrain-lvd1689m/s42/best.pth"
        model:
          arch: "dinov3-linear"
          encoder_name: "facebook/dinov3-vitb16-pretrain-lvd1689m"
          encoder_kwargs:
            hf_model_name: "facebook/dinov3-vitb16-pretrain-lvd1689m"
            patch_size: 16
            freeze_strategy: "none"

  presets:
    - name: "native224_weighted_224_b0_s112"
      overrides:
        inference.data.tile_size: 224
        inference.data.buffer_size: 0
        inference.data.stride: 112
        inference.stitching.mode: "weighted_blend"
        inference.stitching.blend_window: "hann"
