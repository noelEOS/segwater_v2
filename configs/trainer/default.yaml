base_learning_rate: 3e-4
weight_decay: 1e-4
scheduler: "CosineAnnealingLR"
warmup_steps: 500
max_steps: 1500
val_check_interval: 400
accumulate_grad_batches: 1
target_global_batch: 256
gradient_clip_val: 1.0
mixed_precision: true
precision: "bf16"

# Opt-in performance switches (numerics-affecting -> default off so existing
# runs reproduce; see docs/TRAINING_SPEEDUP_NOTES.md). Enable per run, e.g.:
#   trainer.perf.tf32=true trainer.perf.cudnn_benchmark=true trainer.perf.compile=true trainer.perf.fused_adamw=true
perf:
  tf32: false
  cudnn_benchmark: false
  compile: false
  compile_mode: null   # null = torch.compile default; or "reduce-overhead", "max-autotune"
  fused_adamw: false   # fused CUDA AdamW kernel; not bit-identical to the default impl

# Also save the FINAL-step weights (as *_step<N>_last.pth, outside top-k and
# never pruned). For early-vs-late checkpoint comparisons on external evals;
# selection still uses best val mIoU. Applies to stage-2 (train.py) only —
# HPO trials never save a last checkpoint.
save_last: true

# Model-only checkpoint snapshots (stage-2 only; HPO never snapshots). last_frac
# saves at every val check in the final fraction of the run (post-LR-decay);
# every_n_vals also saves every Nth val across the whole run (0 = off). Outside
# top-k, never pruned; ~1/3 the size of a full checkpoint (no optimizer state).
snapshots:
  last_frac: 0.25
  every_n_vals: 4

# wandb step-level logs (train/step_loss, train/learning_rate) are emitted
# every N optimizer steps. Interval metrics are unaffected. N > 1 avoids a
# GPU->CPU sync per step; 1 restores the old per-step logging.
log_every_n_steps: 50

# configs/trainer/default.yaml
epochs: 1
