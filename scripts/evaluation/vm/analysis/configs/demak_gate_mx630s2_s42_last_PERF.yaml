# DEMAK_GATE — mx630_stage2 lineage: Swin-B, canonical 2-stage (HPO + full stage)
# on the mx630 dataset. s42, arm "last" (final step 23930).
# ⚠️ Lineage tag: mx630_stage2. Same DATASET as the mx630k ConvNeXtV2-Tiny run,
#    but different architecture (Swin-B) and different training procedure.
#    Do not pool with pair-based Swin-B or with mx630k without the tag.

sweep:
  name: "demak_gate_mx630s2_s42_last_PERF"
  dry_run: false
  continue_on_error: true

  input_dir: "/home/noel/data_demak_concurrent"
  input_glob: "S1_*.tif"

  common_overrides:
    inference.post_processing.smoothing.apply_simplification: true
    inference.post_processing.smoothing.simplify_tolerance_meters: 1.0
    inference.post_processing.filtering.apply_length_filter: true
    inference.post_processing.filtering.min_length_meters: 10000.0
    inference.data.edge_policy: "shift_inward"
    inference.stitching.min_weight: 0.001
    inference.compute.amp_dtype: "bfloat16"
    inference.compute.tf32: true

  checkpoints:
    - name: "upernet_swin_base_224_mx630s2_last"
      checkpoint_path: "outputs/mx630_stage2/s42/upernet_tu-swin_base_patch4_window7_224_s42_step23930_last.pth"
      model:
        arch: "upernet"
        encoder_name: "tu-swin_base_patch4_window7_224"

  presets:
    - name: "native224_weighted_224_b0_s32"
      overrides:
        inference.data.tile_size: 224
        inference.data.buffer_size: 0
        inference.data.stride: 32
        inference.stitching.mode: "weighted_blend"
        inference.stitching.blend_window: "hann"
