# Pair-based Swin-B SAVE_LAST (final-step step40320) checkpoint, seed s58, stride 32.
# A/B: mirrors aucroc_s58_vm.yaml exactly; only the model_runs run_dir (save_last
# run) and the evaluation.name / output.run_name differ.

evaluation:
  name: "semarang_probability_aucroc_s58_s32_pairbased_savelast"

  reference_dir: "/home/noel/ancillary/demak_semarang/reference_s2"
  reference_glob: "*.tif"
  s1_id_regex: "(S1_\\d{8}_\\d{6}_\\d+_\\d+_\\d+)"

  spatial_policy: "evaluate_geospatial_overlap"
  resolution_atol: 1.0e-12

  valid_mask_path: "/home/noel/ancillary/demak_semarang/valid_mask/GSHHG_GlobalSurfaceWater_combined_mask.tif"
  valid_mask_value: 1

  reference_water_values: [1]
  reference_nodata_values: [255]

  prediction:
    type: "probability_map"
    path_template: "{run_dir}/{s1_id}/{s1_id}_probability_water.tif"

  threshold_sweep:
    enabled: true
    start: 0.0
    stop: 1.0
    step: 0.01
    comparison: "greater_than"
    optimize_metrics: ["iou", "f1", "mcc"]

  model_runs:
    Upernet_Swin_Base_224_savelast_native224_weighted:
      run_dir: "/home/noel/segwater_v2/outputs/inference/runs/dev_sweep_savelast_demak_s58_20260723T123138Z_upernet_swin_base_224_savelast_native224_weighted_224_b0_s32"

  missing_prediction_policy: "record_and_continue"

output:
  root: "/home/noel/pairbased_vm_eval"
  run_name: "semarang_probability_aucroc_s58_s32_pairbased_savelast"
  add_timestamp: false
