# hamp24 stride-8 shard: seed s42, 4 arms, assigned to optimum.
#
# One of the 16 outstanding stride-8 arms split across three machines. The
# original main/fillin division is NOT reproduced (it recorded only which
# checkpoints were staged on 12 Aug); arms are regrouped for balance and each
# of the 16 appears in exactly one shard config.
#
# The sweep name keeps the seed (dev_sweep_hamp24_str8_s42) and each arm is
# named for its architecture alone, so the run dirs match the naming contract
# the scoring specs glob for:
#   dev_sweep_hamp24_str8_s42_<timestamp>_<arch>_native224_weighted_224_b0_s8
#
# Identical to the reported campaign in everything determining the output:
# same 24 scenes, same checkpoints, tile 224, buffer 0, weighted_blend/hann,
# shift_inward, min_weight 0.001. Differences: stride (32 -> 8, the study) and
# throughput (batch_size 64, num_workers 16; invariance verified earlier).

sweep:
  name: "dev_sweep_hamp24_str8_s42"
  dry_run: false
  continue_on_error: true
  max_parallel: 3

  input_dir: "/home/noel/hampyeong_ron_134_ts_16_sn_15_all24"
  input_glob: "S1B_*.tif"

  common_overrides:
    inference.output.root_dir: "outputs/inference"
    inference.post_processing.smoothing.apply_simplification: true
    inference.post_processing.smoothing.simplify_tolerance_meters: 1.0
    inference.post_processing.filtering.apply_length_filter: false
    inference.post_processing.filtering.min_length_meters: 10000.0
    inference.post_processing.filtering.keep_top_k: 5
    inference.data.edge_policy: "shift_inward"
    inference.stitching.min_weight: 0.001
    inference.data.batch_size: 64
    inference.data.num_workers: 16

  checkpoints:
    - name: "dpt_vit_b_16"
      checkpoint_path: "outputs/stage2/dpt_tu-vit_base_patch16_224.mae/s42/best.pth"
      model:
        arch: "dpt"
        encoder_name: "tu-vit_base_patch16_224.mae"

    - name: "segformer_mit_b4"
      checkpoint_path: "outputs/stage2/segformer_mit_b4/s42/best.pth"
      model:
        arch: "segformer"
        encoder_name: "mit_b4"

    - name: "unet_resnet50"
      checkpoint_path: "outputs/stage2/unet_resnet50/s42/best.pth"
      model:
        arch: "unet"
        encoder_name: "resnet50"

    - name: "unetplusplus_resnet50"
      checkpoint_path: "outputs/stage2/unetplusplus_resnet50/s42/best.pth"
      model:
        arch: "unetplusplus"
        encoder_name: "resnet50"


  presets:
    - name: "native224_weighted_224_b0_s8"
      overrides:
        inference.data.tile_size: 224
        inference.data.buffer_size: 0
        inference.data.stride: 8
        inference.stitching.mode: "weighted_blend"
        inference.stitching.blend_window: "hann"
